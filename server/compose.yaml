name: claude-usage

services:
  server:
    build:
      context: .
    image: claude-usage-server
    ports:
      - "8420:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Default to the mounted SQLite volume; set DATABASE_URL in .env to use
      # Postgres/MySQL instead (interpolation lets .env win over this default).
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/usage.db}
    volumes:
      - usage-data:/data
    restart: unless-stopped

volumes:
  usage-data:
